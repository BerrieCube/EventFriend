name: Build EventFriend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Vaste ondertekening, zodat elke nieuwe APK over de vorige heen installeert.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::Geen ANDROID_KEYSTORE_BASE64 secret: APK krijgt een tijdelijke sleutel."
          fi
      - run: flutter pub get
      - name: Build APK
        run: >
          flutter build apk --release
          --build-name=0.1.${{ github.run_number }}
          --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk EventFriend.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EventFriend-apk
          path: EventFriend.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: EventFriend 0.1.${{ github.run_number }}
          body: |
            Download **EventFriend.apk** hieronder en open hem op je Android-telefoon.
            Webversie: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          files: EventFriend.apk
          make_latest: true

  web:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web
        run: >
          flutter build web --release
          --no-web-resources-cdn
          --base-href /${{ github.event.repository.name }}/
      - name: Offline file list
        run: python3 tool/precache.py build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4
