name: eventfriend
description: "EventFriend - de werkapp voor de freelance event technicus."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.2
  pdf: ^3.11.1
  printing: ^5.13.4
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  supabase_flutter: ^2.18.3
  wakelock_plus: ^1.8.2
  file_picker: ^13.3.3
  share_plus: ^13.3.1
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  flutter_local_notifications: ^23.0.1
  home_widget: ^0.10.0
  web: ^1.1.2
  pdfrx: ^2.12.0
  installed_apps: ^2.2.1
  flutter_quill: ^11.6.0
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
